[project]
name = "dns-to-fd"
version = "0.1.0"
description = "A Workshop for "
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.30.0",
    "httpx2>=2.4.0",
    "msgspec>=0.21.1",
    "pdf-oxide>=0.3.67",
    "psycopg2-binary>=2.9.12",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "starlette>=1.3.1",
]
classifiers= [
  "Intended Audience :: ML Reply",
  "Topic :: Engineering"
]
authors = [
  {name = "Fahad Ahmed", email = "fah.ahmed@reply.de"}
]

[build-system]
requires = ["uv_build >= 0.11.21, <0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.uv]
upgrade = true

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.src]
include = [
  "src/dns_to_fd"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "notebooks/*",
]
line-length = 110
indent-width = 4
target-version = "py314"

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
fixable = ["ALL"]
