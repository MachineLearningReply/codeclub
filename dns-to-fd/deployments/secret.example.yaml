apiVersion: v1
kind: Secret
metadata:
  name: dnstofd-secrets
  namespace: dnstofd
  labels:
    app.kubernetes.io/name: dns-to-fd
    app.kubernetes.io/part-of: dns-to-fd
type: Opaque
stringData:
  DB_CONNECTION_STRING: "postgresql+asyncpg://<user>:<password>@<server>.postgres.database.azure.com:5432/<database>?ssl=require"
  BLOB_STORAGE_CONNECTION_STRING: "<storage-connection-string>"
  BLOB_STORAGE_ACCOUNT_URL: "https://<storage-account>.blob.core.windows.net/"
  AZURE_TENANT_ID: "<tenant-id>"
  AZURE_CLIENT_ID: "<client-id>"
  AZURE_CLIENT_SECRET: "<client-secret>"
