services:

  app:
    container_name: app
    build:
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ".env.azure"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  azurestorage:
    container_name: storage
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --tableHost 0.0.0.0 --tablePort 10002 --skipApiVersionCheck"
    volumes:
      - azurite_data:/data
    environment:
      AZURITE_ACCOUNTS: "devstoreaccount1:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="

  database:
    container_name: postgres
    image: postgres:17.7-alpine3.22
    restart: unless-stopped
    env_file:
      - ".env.local"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "postgres"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
  pgadmin_data:
  azurite_data:

